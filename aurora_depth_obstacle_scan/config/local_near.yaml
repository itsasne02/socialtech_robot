# Near-field trial. Horizontal distance is measured from base_link, not the bumper.
# Height is filtered in base_link before projecting to this virtual scan.
aurora_depth_obstacle_scan:
  ros__parameters:
    depth_topic: /slamware_ros_sdk_server_node/depth_image_raw
    camera_info_topic: /slamware_ros_sdk_server_node/camera_info
    scan_topic: /aurora/depth_obstacle_scan
    # How far each bin was seen free, for clearing the depth costmap layer
    # (socialtech_robot_navigation local_costmap_sources/scan_and_aurora_depth_clearing.yaml).
    free_scan_topic: /aurora/depth_free_scan
    min_height: 0.05
    max_height: 0.90
    min_range: 0.20
    # 1.50 until 2026-09-30; 2.00 (Itsasne) to see low obstacles earlier.
    max_range: 2.00
    # Optical Z limits are separate from the horizontal base_link range above.
    # These remain provisional sensor-validity bounds, not a calibrated range.
    min_depth: 0.20
    max_depth: 3.00
    angle_min: -1.5707963267948966
    angle_max: 1.5707963267948966
    angle_increment: 0.017453292519943295
    pixel_stride_x: 2
    pixel_stride_y: 2
    publish_rate: 5.0
    transform_tolerance: 0.05
    max_input_age: 1.0
